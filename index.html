<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whisky Club Selector</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header>
    <h1>🥃 Whisky Club</h1>
    <p>Pick a number, taste the dram</p>
  </header>

  <div class="container">

    <!-- Add entry -->
    <div class="card">
      <h2>Add Whisky Entry</h2>
      <div class="entry-form">
        <input type="number" class="ef-num" id="entryNum" placeholder="#" min="1" max="101" aria-label="Whisky entry number (1–101)" />
        <input type="text"   class="ef-ed4" id="entryEd4" placeholder="4th Edition whisky" maxlength="80" aria-label="4th Edition whisky name" />
        <input type="text"   class="ef-ed5" id="entryEd5" placeholder="5th Edition whisky" maxlength="80" aria-label="5th Edition whisky name" />
        <button class="btn-add ef-add" onclick="addEntry()">Add</button>
      </div>
      <p class="field-hint">Number (1–101) · 4th Edition name · 5th Edition name</p>
    </div>

    <!-- Entries list -->
    <div class="card">
      <div class="header-row">
        <h2>Whisky Entries</h2>
        <div style="display:flex;gap:0.5rem;align-items:center;">
          <span class="count-badge" id="entryCountBadge">0 entries</span>
          <button class="btn-clear" onclick="clearEntries()">Clear all</button>
        </div>
      </div>
      <div class="entries-list" id="entriesList"></div>
    </div>

    <!-- Select button -->
    <button class="btn-select" id="selectBtn" onclick="selectNumber()" disabled>
      🎲 Pick Tonight's Number
    </button>

    <!-- Result + inline review form -->
    <div class="card result-card" id="resultCard">
      <h2>Tonight's Dram</h2>
      <div class="result-number" id="resultNumber"></div>
      <div class="result-sub">Sláinte! 🥃</div>
      <div class="result-editions" id="resultEditions"></div>
      <div class="rng-display" id="rngDisplay"></div>

      <!-- Price Tracker -->
      <div class="price-tracker" id="priceTracker">
        <div class="price-tracker-hdr">
          <h3>💰 Best Price</h3>
        </div>
        <div id="aiSearchResult"></div>
      </div>

      <button class="btn-secondary" onclick="toggleReviewForm()" style="margin-top:1rem;">✍️ Add Tasting Notes</button>

      <div class="review-form" id="reviewForm">
        <h3>Rate &amp; Review</h3>
        <div class="person-ratings" id="personRatings"></div>
        <div class="avg-display" id="avgDisplay">Average: <span class="avg-val">—</span></div>
        <textarea id="reviewNotes" placeholder="Tasting notes… e.g. rich dried fruit, hint of peat, long finish" aria-label="Tasting notes" style="margin-top:0.6rem;"></textarea>
        <div class="review-actions">
          <button class="btn-add" onclick="saveReview()">Save Review</button>
          <button class="btn-clear" onclick="toggleReviewForm()">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Reviews history -->
    <div class="card reviews-section" id="reviewsSection">
      <div class="header-row">
        <h2>Tasting Notes</h2>
        <div style="display:flex;gap:0.5rem;align-items:center;">
          <span class="count-badge" id="reviewCountBadge">0</span>
          <span class="sync-status off" id="syncStatus">⟳</span>
          <button class="btn-icon" onclick="syncPull()" title="Refresh from cloud">↻ Refresh</button>
          <button class="btn-clear" onclick="clearReviews()">Clear all</button>
        </div>
      </div>
      <div class="filter-bar">
        <input type="text" id="filterSearch" placeholder="🔍 Filter by #number or whisky name…" oninput="renderReviews()" aria-label="Filter reviews by number or whisky name" />
        <select id="sortOrder" onchange="renderReviews()" aria-label="Sort reviews by">
          <option value="date-desc">Newest first</option>
          <option value="date-asc">Oldest first</option>
          <option value="num-asc">Number ↑</option>
          <option value="num-desc">Number ↓</option>
          <option value="rating-desc">Rating ↓</option>
          <option value="rating-asc">Rating ↑</option>
        </select>
      </div>
      <div id="reviewsList"></div>
    </div>

  </div>

  <footer>Whisky Club Selector &mdash; sip responsibly</footer>

  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ratings.js"></script>
  <script src="js/entries.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/price.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
