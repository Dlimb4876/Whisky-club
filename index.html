<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whisky Club Selector</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: #1a0a00;
      color: #f0e6d3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.5rem;
      color: #c8922a;
      letter-spacing: 2px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    header p {
      margin-top: 0.5rem;
      color: #b09070;
      font-style: italic;
    }

    .container {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: #2c1200;
      border: 1px solid #5a3010;
      border-radius: 8px;
      padding: 1.5rem;
    }

    .card h2 {
      color: #c8922a;
      font-size: 1.2rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid #5a3010;
      padding-bottom: 0.5rem;
    }

    input[type="text"], input[type="number"], textarea, select {
      padding: 0.6rem 0.8rem;
      border: 1px solid #5a3010;
      border-radius: 4px;
      background: #1a0a00;
      color: #f0e6d3;
      font-family: inherit;
      font-size: 1rem;
    }

    textarea {
      width: 100%;
      resize: vertical;
      min-height: 80px;
    }

    select { cursor: pointer; }

    input[type="text"]::placeholder,
    input[type="number"]::placeholder,
    textarea::placeholder { color: #6b4c30; }

    input[type="text"]:focus,
    input[type="number"]:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #c8922a;
    }

    button {
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .btn-add {
      background: #c8922a;
      color: #1a0a00;
      font-weight: bold;
    }

    .btn-add:hover { background: #e0a830; }
    .btn-add:disabled { background: #5a3010; color: #3c1800; cursor: not-allowed; }

    .btn-remove {
      background: transparent;
      color: #8b5030;
      border: 1px solid #5a3010;
      padding: 0.3rem 0.6rem;
      font-size: 0.85rem;
    }

    .btn-remove:hover { background: #3c1800; color: #c8922a; }

    .btn-select {
      width: 100%;
      padding: 0.9rem;
      background: #8b2500;
      color: #f0e6d3;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 4px;
    }

    .btn-select:hover { background: #a83010; }
    .btn-select:disabled { background: #3c1800; color: #5a3010; cursor: not-allowed; }

    .btn-clear {
      background: transparent;
      border: 1px solid #5a3010;
      color: #8b5030;
      font-size: 0.85rem;
    }

    .btn-clear:hover { border-color: #8b2500; color: #c8922a; }

    .btn-secondary {
      background: transparent;
      border: 1px solid #c8922a;
      color: #c8922a;
      font-size: 0.9rem;
    }

    .btn-secondary:hover { background: #3c1800; }

    .btn-icon {
      background: transparent;
      border: 1px solid #5a3010;
      color: #b09070;
      font-size: 0.85rem;
      padding: 0.4rem 0.7rem;
    }

    .btn-icon:hover { border-color: #c8922a; color: #c8922a; }

    /* Entry add form */
    .entry-form {
      display: grid;
      grid-template-columns: 68px 1fr 1fr auto;
      gap: 0.5rem;
      align-items: start;
    }

    .entry-form input[type="number"] { width: 100%; }
    .entry-form input[type="text"]   { width: 100%; }

    @media (max-width: 540px) {
      .entry-form {
        grid-template-columns: 68px 1fr;
        grid-template-rows: auto auto auto;
      }
      .entry-form .ef-num  { grid-column: 1; grid-row: 1; }
      .entry-form .ef-ed4  { grid-column: 2; grid-row: 1; }
      .entry-form .ef-ed5  { grid-column: 1 / span 2; grid-row: 2; }
      .entry-form .ef-add  { grid-column: 1 / span 2; grid-row: 3; }
    }

    .field-hint {
      font-size: 0.75rem;
      color: #6b4c30;
      margin-top: 0.4rem;
    }

    /* Entries list */
    .entries-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-height: 300px;
      overflow-y: auto;
    }

    .entry-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #1a0a00;
      border: 1px solid #3c1800;
      border-radius: 4px;
      padding: 0.5rem 0.8rem;
      font-size: 0.9rem;
    }

    .entry-item.used {
      opacity: 0.5;
      border-style: dashed;
    }

    .entry-item.selected-entry {
      border-color: #c8922a;
      background: #3c1800;
    }

    .entry-num {
      background: #5a3010;
      color: #c8922a;
      font-weight: bold;
      font-size: 0.85rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      min-width: 38px;
      text-align: center;
      flex-shrink: 0;
    }

    .entry-names {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .entry-ed {
      color: #b09070;
      font-size: 0.82rem;
    }

    .entry-ed strong { color: #f0e6d3; }

    .used-badge {
      font-size: 0.7rem;
      background: #3c1800;
      color: #8b5030;
      padding: 0.1rem 0.4rem;
      border-radius: 10px;
      flex-shrink: 0;
    }

    /* Result card */
    .result-card {
      text-align: center;
      display: none;
    }

    .result-card.visible { display: block; }

    .result-number {
      font-size: 3.5rem;
      font-weight: bold;
      color: #c8922a;
      margin: 0.3rem 0;
      line-height: 1;
    }

    .result-editions {
      margin: 0.6rem 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .result-edition {
      font-size: 1rem;
    }

    .result-edition .ed-label {
      color: #8b5030;
      font-size: 0.85rem;
      font-style: italic;
    }

    .result-edition .ed-name {
      color: #f8d080;
      font-weight: bold;
    }

    .result-sub {
      color: #b09070;
      font-style: italic;
      margin-bottom: 0.8rem;
    }

    .rng-display {
      display: inline-block;
      background: #1a0a00;
      border: 1px solid #5a3010;
      border-radius: 4px;
      padding: 0.4rem 1rem;
      color: #b09070;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .rng-display span {
      color: #c8922a;
      font-weight: bold;
    }

    /* Review form */
    .review-form {
      display: none;
      margin-top: 1rem;
      border-top: 1px solid #5a3010;
      padding-top: 1rem;
      text-align: left;
    }

    .review-form.visible { display: block; }

    .review-form h3 {
      color: #c8922a;
      font-size: 1rem;
      margin-bottom: 0.8rem;
    }

    /* Per-person star ratings */
    .person-ratings {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }

    .person-rating-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .person-label {
      width: 65px;
      color: #b09070;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .star-row {
      display: flex;
      gap: 0.2rem;
    }

    .star {
      font-size: 1.5rem;
      cursor: pointer;
      color: #5a3010;
      transition: color 0.15s;
      user-select: none;
    }

    .star.active { color: #c8922a; }
    .star:hover  { color: #e0a830; }

    .avg-display {
      margin-bottom: 0.6rem;
      padding: 0.4rem 0.8rem;
      background: #1a0a00;
      border: 1px solid #5a3010;
      border-radius: 4px;
      font-size: 0.9rem;
      color: #b09070;
    }

    .avg-display .avg-stars { color: #c8922a; }
    .avg-display .avg-val   { color: #c8922a; font-weight: bold; }

    .review-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.8rem;
    }

    /* Reviews history */
    .reviews-section { display: none; }
    .reviews-section.visible { display: block; }

    /* Sort / filter bar */
    .filter-bar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid #3c1800;
    }

    .filter-bar input[type="text"] {
      flex: 1;
      min-width: 120px;
      font-size: 0.85rem;
      padding: 0.4rem 0.7rem;
    }

    .filter-bar select {
      font-size: 0.85rem;
      padding: 0.4rem 0.6rem;
    }

    .review-entry {
      background: #1a0a00;
      border: 1px solid #3c1800;
      border-radius: 4px;
      padding: 0.8rem;
      margin-bottom: 0.6rem;
      font-size: 0.9rem;
    }

    .review-entry:last-child { margin-bottom: 0; }

    .review-entry-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.4rem;
    }

    .review-num-badge {
      background: #5a3010;
      color: #c8922a;
      font-weight: bold;
      font-size: 0.85rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      margin-right: 0.4rem;
      flex-shrink: 0;
    }

    .review-whisky-name {
      color: #f8d080;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .review-edition-names {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      margin-bottom: 0.4rem;
    }

    .review-ed-line {
      font-size: 0.85rem;
      color: #b09070;
    }

    .review-ed-line strong { color: #f0e6d3; }

    .review-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.15rem;
      flex-shrink: 0;
      margin-left: 0.5rem;
    }

    .review-date { color: #5a3010; font-size: 0.8rem; }

    .review-person-ratings {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      margin-bottom: 0.35rem;
    }

    .review-person-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
    }

    .review-person-name {
      width: 58px;
      color: #8b5030;
    }

    .review-person-stars { color: #c8922a; letter-spacing: 1px; }

    .review-avg-line {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
    }

    .review-avg-label { color: #b09070; font-size: 0.8rem; }
    .review-avg-stars { color: #c8922a; }
    .review-avg-val   { color: #f8d080; font-weight: bold; }

    .review-stars {
      color: #c8922a;
      font-size: 1rem;
      margin-bottom: 0.3rem;
      letter-spacing: 1px;
    }

    .review-notes {
      color: #b09070;
      font-style: italic;
      line-height: 1.5;
    }

    .review-entry-actions {
      margin-top: 0.4rem;
      text-align: right;
    }

    .btn-delete-review {
      background: transparent;
      border: none;
      color: #5a3010;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
    }

    .btn-delete-review:hover { color: #8b2500; }

    .sync-status {
      font-size: 0.8rem;
      padding: 0.2rem 0.6rem;
      border-radius: 10px;
    }

    .sync-status.ok   { background: #1a3c00; color: #6fcf40; }
    .sync-status.err  { background: #3c0000; color: #cf4040; }
    .sync-status.busy { background: #3c2000; color: #c8922a; }
    .sync-status.off  { background: #1a0a00; color: #5a3010; border: 1px solid #3c1800; }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 1px solid #5a3010;
      padding-bottom: 0.5rem;
    }

    .header-row h2 { border: none; padding: 0; margin: 0; }

    .count-badge {
      background: #5a3010;
      color: #c8922a;
      font-size: 0.8rem;
      padding: 0.2rem 0.5rem;
      border-radius: 10px;
    }

    .no-reviews {
      color: #5a3010;
      font-style: italic;
      font-size: 0.9rem;
      text-align: center;
      padding: 1rem 0;
    }

    footer {
      margin-top: 2rem;
      color: #5a3010;
      font-size: 0.8rem;
      text-align: center;
    }

    /* ── Price Tracker ───────────────────────────────────────────────────────── */

    .price-tracker {
      margin-top: 1rem;
      border-top: 1px solid #5a3010;
      padding-top: 1rem;
      text-align: left;
    }

    .price-tracker-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.7rem;
    }

    .price-tracker-hdr h3 {
      color: #c8922a;
      font-size: 1rem;
      margin: 0;
    }

    .price-search-section {
      margin-bottom: 0.8rem;
    }

    .price-search-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.3rem;
    }

    .price-search-label {
      color: #8b5030;
      font-size: 0.78rem;
      min-width: 0;
      flex-shrink: 0;
    }

    .btn-retailer {
      background: #1a0a00;
      border: 1px solid #5a3010;
      color: #b09070;
      font-size: 0.78rem;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-retailer:hover { border-color: #c8922a; color: #f8d080; }

    .price-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 0.6rem;
    }

    .price-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #1a0a00;
      border: 1px solid #3c1800;
      border-radius: 4px;
      padding: 0.45rem 0.7rem;
      font-size: 0.85rem;
      flex-wrap: wrap;
    }

    .price-item.cheapest { border-color: #c8922a; }

    .price-amount {
      color: #f8d080;
      font-weight: bold;
      font-size: 0.95rem;
      min-width: 55px;
      flex-shrink: 0;
    }

    .price-retailer { flex: 1; color: #b09070; min-width: 80px; }
    .price-retailer a { color: #b09070; text-decoration: underline; }
    .price-retailer a:hover { color: #c8922a; }

    .price-by { color: #5a3010; font-size: 0.78rem; flex-shrink: 0; }

    .price-cheapest-badge {
      font-size: 0.7rem;
      background: #3c2800;
      color: #c8922a;
      padding: 0.1rem 0.4rem;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .no-prices {
      color: #5a3010;
      font-style: italic;
      font-size: 0.85rem;
      padding: 0.2rem 0;
    }

    .price-log-form {
      display: none;
      margin-top: 0.5rem;
      padding-top: 0.6rem;
      border-top: 1px solid #3c1800;
    }

    .price-log-form.visible { display: block; }

    .price-log-grid {
      display: grid;
      grid-template-columns: 95px 1fr 90px auto;
      gap: 0.4rem;
      align-items: center;
      margin-bottom: 0.4rem;
    }

    @media (max-width: 540px) {
      .price-log-grid {
        grid-template-columns: 1fr 1fr;
      }
      .price-log-grid .pl-save { grid-column: 1 / span 2; }
    }

    .price-log-grid input,
    .price-log-grid select { width: 100%; }
  </style>
</head>
<body>

  <header>
    <h1>🥃 Whisky Club</h1>
    <p>Pick a number, taste the dram</p>
  </header>

  <div class="container">

    <!-- Add entry -->
    <div class="card">
      <h2>Add Whisky Entry</h2>
      <div class="entry-form">
        <input type="number" class="ef-num" id="entryNum" placeholder="#" min="1" max="101" aria-label="Whisky entry number (1–101)" />
        <input type="text"   class="ef-ed4" id="entryEd4" placeholder="4th Edition whisky" maxlength="80" aria-label="4th Edition whisky name" />
        <input type="text"   class="ef-ed5" id="entryEd5" placeholder="5th Edition whisky" maxlength="80" aria-label="5th Edition whisky name" />
        <button class="btn-add ef-add" onclick="addEntry()">Add</button>
      </div>
      <p class="field-hint">Number (1–101) · 4th Edition name · 5th Edition name</p>
    </div>

    <!-- Entries list -->
    <div class="card">
      <div class="header-row">
        <h2>Whisky Entries</h2>
        <div style="display:flex;gap:0.5rem;align-items:center;">
          <span class="count-badge" id="entryCountBadge">0 entries</span>
          <button class="btn-clear" onclick="clearEntries()">Clear all</button>
        </div>
      </div>
      <div class="entries-list" id="entriesList"></div>
    </div>

    <!-- Select button -->
    <button class="btn-select" id="selectBtn" onclick="selectNumber()" disabled>
      🎲 Pick Tonight's Number
    </button>

    <!-- Result + inline review form -->
    <div class="card result-card" id="resultCard">
      <h2>Tonight's Dram</h2>
      <div class="result-number" id="resultNumber"></div>
      <div class="result-sub">Sláinte! 🥃</div>
      <div class="result-editions" id="resultEditions"></div>
      <div class="rng-display" id="rngDisplay"></div>

      <!-- Price Tracker -->
      <div class="price-tracker" id="priceTracker">
        <div class="price-tracker-hdr">
          <h3>💰 Price Tracker</h3>
          <button class="btn-icon" onclick="togglePriceLogForm()">+ Log a Price</button>
        </div>
        <div class="price-search-section" id="priceSearchSection"></div>
        <div class="price-list" id="priceList"></div>
        <div class="price-log-form" id="priceLogForm">
          <div class="price-log-grid">
            <select id="plPerson" aria-label="Your name">
              <option>Kev</option><option>John</option><option>Dan</option><option>Morgan</option>
            </select>
            <input type="text"   id="plRetailer" placeholder="Retailer" maxlength="60" aria-label="Retailer name" />
            <input type="number" id="plPrice"    placeholder="£ price" min="0" step="0.01" aria-label="Price in pounds" />
            <button class="btn-add pl-save" onclick="logPrice()">Save</button>
          </div>
          <input type="text" id="plUrl" placeholder="URL (optional)" maxlength="400" aria-label="Product URL" style="width:100%;margin-top:0;" />
        </div>
      </div>

      <button class="btn-secondary" onclick="toggleReviewForm()" style="margin-top:1rem;">✍️ Add Tasting Notes</button>

      <div class="review-form" id="reviewForm">
        <h3>Rate &amp; Review</h3>
        <div class="person-ratings" id="personRatings"></div>
        <div class="avg-display" id="avgDisplay">Average: <span class="avg-val">—</span></div>
        <textarea id="reviewNotes" placeholder="Tasting notes… e.g. rich dried fruit, hint of peat, long finish" aria-label="Tasting notes" style="margin-top:0.6rem;"></textarea>
        <div class="review-actions">
          <button class="btn-add" onclick="saveReview()">Save Review</button>
          <button class="btn-clear" onclick="toggleReviewForm()">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Reviews history -->
    <div class="card reviews-section" id="reviewsSection">
      <div class="header-row">
        <h2>Tasting Notes</h2>
        <div style="display:flex;gap:0.5rem;align-items:center;">
          <span class="count-badge" id="reviewCountBadge">0</span>
          <span class="sync-status off" id="syncStatus">⟳</span>
          <button class="btn-icon" onclick="syncPull()" title="Refresh from cloud">↻ Refresh</button>
          <button class="btn-clear" onclick="clearReviews()">Clear all</button>
        </div>
      </div>
      <div class="filter-bar">
        <input type="text" id="filterSearch" placeholder="🔍 Filter by #number or whisky name…" oninput="renderReviews()" aria-label="Filter reviews by number or whisky name" />
        <select id="sortOrder" onchange="renderReviews()" aria-label="Sort reviews by">
          <option value="date-desc">Newest first</option>
          <option value="date-asc">Oldest first</option>
          <option value="num-asc">Number ↑</option>
          <option value="num-desc">Number ↓</option>
          <option value="rating-desc">Rating ↓</option>
          <option value="rating-asc">Rating ↑</option>
        </select>
      </div>
      <div id="reviewsList"></div>
    </div>

  </div>

  <footer>Whisky Club Selector &mdash; sip responsibly</footer>

  <script>
    const ENTRIES_KEY  = 'whisky-club-entries';
    const USED_KEY     = 'whisky-club-used';
    const REVIEWS_KEY  = 'whisky-club-reviews';
    const PRICES_KEY   = 'whisky-club-prices';
    const JSONBIN_BASE = 'https://api.jsonbin.io/v3';
    const JSONBIN_KEY  = '$2a$10$7sndeshKqvuoqFr.LDI8eOHtIomBtO83.wPskt3Y33i0NfNekDisC';
    const JSONBIN_BIN  = '69b6b0bbb7ec241ddc6e2ca0';

    const PERSONS = ['Kev', 'John', 'Dan', 'Morgan'];

    const RETAILERS = [
      { name: 'TWE',    url: 'https://www.thewhiskyexchange.com/search?q=' },
      { name: 'MoM',    url: 'https://www.masterofmalt.com/search/?q=' },
      { name: 'Amazon', url: 'https://www.amazon.co.uk/s?k=' }
    ];

    let entries  = JSON.parse(localStorage.getItem(ENTRIES_KEY)  || '{}');
    let usedNums = JSON.parse(localStorage.getItem(USED_KEY)     || '[]');
    let reviews  = JSON.parse(localStorage.getItem(REVIEWS_KEY)  || '[]');
    let prices   = JSON.parse(localStorage.getItem(PRICES_KEY)   || '[]');

    let currentNum     = null;
    let currentRatings = {};

    function resetRatings() {
      currentRatings = {};
      PERSONS.forEach(function(p) { currentRatings[p.toLowerCase()] = 0; });
    }
    resetRatings();

    // ── Persistence ───────────────────────────────────────────────────────────

    function saveEntries()      { localStorage.setItem(ENTRIES_KEY, JSON.stringify(entries)); }
    function saveUsed()         { localStorage.setItem(USED_KEY,    JSON.stringify(usedNums)); }
    function saveReviewsLocal() { localStorage.setItem(REVIEWS_KEY, JSON.stringify(reviews)); }
    function savePricesLocal()  { localStorage.setItem(PRICES_KEY,  JSON.stringify(prices)); }

    // ── Entries management ────────────────────────────────────────────────────

    function addEntry() {
      const numInput = document.getElementById('entryNum');
      const ed4Input = document.getElementById('entryEd4');
      const ed5Input = document.getElementById('entryEd5');
      const num = parseInt(numInput.value, 10);
      const ed4 = ed4Input.value.trim();
      const ed5 = ed5Input.value.trim();

      if (isNaN(num) || num < 1 || num > 101) { flash(numInput); return; }
      if (!ed4) { flash(ed4Input); return; }
      if (!ed5) { flash(ed5Input); return; }

      entries[num] = { ed4: ed4, ed5: ed5 };
      numInput.value = '';
      ed4Input.value = '';
      ed5Input.value = '';
      saveEntries();
      renderEntries();
    }

    function removeEntry(num) {
      if (currentNum === num) {
        currentNum = null;
        document.getElementById('resultCard').classList.remove('visible');
      }
      delete entries[num];
      usedNums = usedNums.filter(function(n) { return n !== num; });
      saveEntries();
      saveUsed();
      renderEntries();
    }

    function clearEntries() {
      if (Object.keys(entries).length === 0) return;
      if (!confirm('Remove all whisky entries?')) return;
      entries  = {};
      usedNums = [];
      currentNum = null;
      document.getElementById('resultCard').classList.remove('visible');
      saveEntries();
      saveUsed();
      renderEntries();
    }

    function renderEntries() {
      const container = document.getElementById('entriesList');
      const badge     = document.getElementById('entryCountBadge');
      const btn       = document.getElementById('selectBtn');

      container.innerHTML = '';
      const nums      = Object.keys(entries).map(Number).sort(function(a, b) { return a - b; });
      const available = nums.filter(function(n) { return !usedNums.includes(n); });

      badge.textContent = nums.length + ' entr' + (nums.length === 1 ? 'y' : 'ies') +
        ' · ' + available.length + ' available';
      btn.disabled = available.length === 0;

      if (nums.length === 0) {
        container.innerHTML = '<p style="color:#5a3010;font-style:italic;font-size:0.9rem;">No entries added yet.</p>';
        return;
      }

      nums.forEach(function(n) {
        const e    = entries[n];
        const used = usedNums.includes(n);
        const item = document.createElement('div');
        item.className = 'entry-item' +
          (used ? ' used' : '') +
          (n === currentNum ? ' selected-entry' : '');
        item.innerHTML =
          '<span class="entry-num">#' + n + '</span>' +
          '<div class="entry-names">' +
            '<div class="entry-ed"><span style="color:#8b5030">4th:</span> <strong>' + escHtml(e.ed4) + '</strong></div>' +
            '<div class="entry-ed"><span style="color:#8b5030">5th:</span> <strong>' + escHtml(e.ed5) + '</strong></div>' +
          '</div>' +
          (used ? '<span class="used-badge">used</span>' : '') +
          '<button class="btn-remove" onclick="removeEntry(' + n + ')">Remove</button>';
        container.appendChild(item);
      });
    }

    // ── Selection ─────────────────────────────────────────────────────────────

    function selectNumber() {
      const available = Object.keys(entries).map(Number)
        .filter(function(n) { return !usedNums.includes(n); });
      if (available.length === 0) return;

      const idx = Math.floor(Math.random() * available.length);
      const num = available[idx];
      currentNum = num;

      if (!usedNums.includes(num)) {
        usedNums.push(num);
        saveUsed();
      }

      const entry = entries[num];
      document.getElementById('resultNumber').textContent = '#' + num;
      document.getElementById('resultEditions').innerHTML =
        '<div class="result-edition"><span class="ed-label">4th Edition: </span>' +
          '<span class="ed-name">' + escHtml(entry.ed4) + '</span></div>' +
        '<div class="result-edition"><span class="ed-label">5th Edition: </span>' +
          '<span class="ed-name">' + escHtml(entry.ed5) + '</span></div>';
      document.getElementById('rngDisplay').innerHTML =
        'Number: <span>' + num + '</span> · drawn from <span>' + available.length + '</span> available';

      document.getElementById('resultCard').classList.add('visible');
      resetRatings();
      buildPersonRatingRows();
      document.getElementById('reviewNotes').value = '';
      document.getElementById('reviewForm').classList.remove('visible');
      renderPriceTracker(num);
      renderEntries();
      document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // ── Per-person star ratings ───────────────────────────────────────────────

    function buildPersonRatingRows() {
      const container = document.getElementById('personRatings');
      container.innerHTML = '';

      PERSONS.forEach(function(person) {
        const key = person.toLowerCase();
        const row = document.createElement('div');
        row.className = 'person-rating-row';

        const label = document.createElement('span');
        label.className   = 'person-label';
        label.textContent = person + ':';

        const starRow = document.createElement('div');
        starRow.className       = 'star-row';
        starRow.dataset.person  = key;

        for (var v = 1; v <= 5; v++) {
          (function(val) {
            var star = document.createElement('span');
            star.className      = 'star';
            star.textContent    = '★';
            star.dataset.value  = val;
            star.dataset.person = key;

            star.addEventListener('click', function() { setPersonRating(key, val); });
            star.addEventListener('mouseover', function() {
              starRow.querySelectorAll('.star').forEach(function(s) {
                s.style.color = parseInt(s.dataset.value) <= val ? '#e0a830' : '';
              });
            });
            star.addEventListener('mouseleave', function() {
              starRow.querySelectorAll('.star').forEach(function(s) { s.style.color = ''; });
            });
            starRow.appendChild(star);
          })(v);
        }

        row.appendChild(label);
        row.appendChild(starRow);
        container.appendChild(row);
      });

      updateAvgDisplay();
    }

    function setPersonRating(personKey, value) {
      currentRatings[personKey] = value;
      const row = document.querySelector('.star-row[data-person="' + personKey + '"]');
      if (row) {
        row.querySelectorAll('.star').forEach(function(s) {
          s.classList.toggle('active', parseInt(s.dataset.value) <= value);
        });
      }
      updateAvgDisplay();
    }

    function updateAvgDisplay() {
      const avg = calcAvg(currentRatings);
      const el  = document.getElementById('avgDisplay');
      if (avg === 0) {
        el.innerHTML = 'Average: <span class="avg-val">—</span>';
        return;
      }
      el.innerHTML =
        'Average: <span class="avg-stars">' + starsHtml(avg) + '</span>' +
        ' <span class="avg-val">(' + avg.toFixed(1) + ')</span>';
    }

    // ── Review form ───────────────────────────────────────────────────────────

    function toggleReviewForm() {
      const form = document.getElementById('reviewForm');
      form.classList.toggle('visible');
      if (form.classList.contains('visible')) {
        buildPersonRatingRows();
        document.getElementById('reviewNotes').focus();
      }
    }

    async function saveReview() {
      if (currentNum === null) return;
      const notes = document.getElementById('reviewNotes').value.trim();
      const vals  = PERSONS.map(function(p) { return currentRatings[p.toLowerCase()]; });
      const hasRating = vals.some(function(v) { return v > 0; });

      if (!hasRating && !notes) {
        flash(document.getElementById('reviewNotes'));
        return;
      }

      const entry = entries[currentNum] || { ed4: '', ed5: '' };
      const now   = new Date();
      const date  = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

      var ratings = {};
      PERSONS.forEach(function(p) { ratings[p.toLowerCase()] = currentRatings[p.toLowerCase()]; });

      const avg = calcAvg(ratings);

      reviews.push({
        number:    currentNum,
        ed4:       entry.ed4,
        ed5:       entry.ed5,
        ratings:   ratings,
        ratingAvg: parseFloat(avg.toFixed(2)),
        notes:     notes,
        date:      date,
        timestamp: now.getTime()
      });

      saveReviewsLocal();
      renderReviews();
      document.getElementById('reviewForm').classList.remove('visible');
      await syncPush();
      document.getElementById('reviewsSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function deleteReview(index) {
      if (!confirm('Delete this tasting note?')) return;
      reviews.splice(index, 1);
      saveReviewsLocal();
      renderReviews();
      syncPush();
    }

    function clearReviews() {
      if (reviews.length === 0) return;
      if (!confirm('Delete all tasting notes? This will also clear them from the cloud.')) return;
      reviews = [];
      saveReviewsLocal();
      renderReviews();
      syncPush();
    }

    // ── Reviews render ────────────────────────────────────────────────────────

    function renderReviews() {
      const container = document.getElementById('reviewsList');
      const section   = document.getElementById('reviewsSection');
      const badge     = document.getElementById('reviewCountBadge');

      badge.textContent = reviews.length;

      if (reviews.length === 0) {
        section.classList.remove('visible');
        return;
      }

      section.classList.add('visible');

      const search    = (document.getElementById('filterSearch').value || '').toLowerCase().trim();
      const sortOrder = document.getElementById('sortOrder').value || 'date-desc';

      var items = reviews.map(function(r, i) { return { r: r, i: i }; });

      if (search) {
        items = items.filter(function(item) {
          var r = item.r;
          return String(r.number || '').includes(search) ||
            (r.ed4   || '').toLowerCase().includes(search) ||
            (r.ed5   || '').toLowerCase().includes(search) ||
            (r.whisky|| '').toLowerCase().includes(search) ||
            (r.notes || '').toLowerCase().includes(search);
        });
      }

      items.sort(function(a, b) {
        var ra = a.r, rb = b.r;
        switch (sortOrder) {
          case 'date-asc':    return (ra.timestamp || 0) - (rb.timestamp || 0);
          case 'date-desc':   return (rb.timestamp || 0) - (ra.timestamp || 0);
          case 'num-asc':     return (ra.number    || 0) - (rb.number    || 0);
          case 'num-desc':    return (rb.number    || 0) - (ra.number    || 0);
          case 'rating-asc':  return (ra.ratingAvg || 0) - (rb.ratingAvg || 0);
          case 'rating-desc': return (rb.ratingAvg || 0) - (ra.ratingAvg || 0);
          default:            return (rb.timestamp || 0) - (ra.timestamp || 0);
        }
      });

      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = '<p class="no-reviews">No reviews match your filter.</p>';
        return;
      }

      items.forEach(function(item) {
        var r       = item.r;
        var realIdx = item.i;
        var entry   = document.createElement('div');
        entry.className = 'review-entry';

        // Per-person ratings
        var personHtml = '';
        if (r.ratings) {
          PERSONS.forEach(function(p) {
            var val = r.ratings[p.toLowerCase()] || 0;
            if (val > 0) {
              personHtml +=
                '<div class="review-person-row">' +
                  '<span class="review-person-name">' + p + ':</span>' +
                  '<span class="review-person-stars">' + starsHtml(val) + '</span>' +
                '</div>';
            }
          });
        } else if (r.rating) {
          // Legacy single-rating fallback
          personHtml = '<div class="review-stars">' + starsHtml(r.rating) + '</div>';
        }

        // Average line
        var avgHtml = '';
        if (r.ratingAvg) {
          avgHtml =
            '<div class="review-avg-line">' +
              '<span class="review-avg-label">Avg:</span>' +
              '<span class="review-avg-stars">' + starsHtml(r.ratingAvg) + '</span>' +
              '<span class="review-avg-val">(' + r.ratingAvg.toFixed(1) + ')</span>' +
            '</div>';
        }

        // Edition lines
        var edHtml = '';
        if (r.ed4 || r.ed5) {
          edHtml = '<div class="review-edition-names">' +
            (r.ed4 ? '<div class="review-ed-line"><span style="color:#8b5030">4th:</span> <strong>' + escHtml(r.ed4) + '</strong></div>' : '') +
            (r.ed5 ? '<div class="review-ed-line"><span style="color:#8b5030">5th:</span> <strong>' + escHtml(r.ed5) + '</strong></div>' : '') +
          '</div>';
        }

        // Header title (number badge + optional legacy whisky name)
        var titleHtml = (r.number !== undefined)
          ? '<span class="review-num-badge">#' + r.number + '</span>'
          : '';
        if (r.whisky && !r.ed4) {
          titleHtml += '<span class="review-whisky-name">' + escHtml(r.whisky) + '</span>';
        }

        entry.innerHTML =
          '<div class="review-entry-header">' +
            '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:0.3rem;">' + titleHtml + '</div>' +
            '<div class="review-meta"><span class="review-date">' + escHtml(r.date || '') + '</span></div>' +
          '</div>' +
          edHtml +
          (personHtml ? '<div class="review-person-ratings">' + personHtml + '</div>' : '') +
          avgHtml +
          (r.notes ? '<div class="review-notes">' + escHtml(r.notes) + '</div>' : '') +
          '<div class="review-entry-actions">' +
            '<button class="btn-delete-review" onclick="deleteReview(' + realIdx + ')">✕ Delete</button>' +
          '</div>';

        container.appendChild(entry);
      });
    }

    // ── Cloud sync ────────────────────────────────────────────────────────────

    function setSyncStatus(state, text) {
      var el = document.getElementById('syncStatus');
      el.className   = 'sync-status ' + state;
      el.textContent = text;
    }

    async function syncPull() {
      setSyncStatus('busy', '⟳ Fetching…');
      try {
        const res  = await fetch(JSONBIN_BASE + '/b/' + JSONBIN_BIN + '/latest', {
          headers: { 'X-Master-Key': JSONBIN_KEY }
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        reviews = Array.isArray(data.record.reviews) ? data.record.reviews : [];
        prices  = Array.isArray(data.record.prices)  ? data.record.prices  : [];
        saveReviewsLocal();
        savePricesLocal();
        renderReviews();
        if (currentNum !== null) renderPriceTracker(currentNum);
        setSyncStatus('ok', '✓ Synced');
      } catch (e) {
        setSyncStatus('err', '✗ Sync error');
      }
    }

    async function syncPush() {
      setSyncStatus('busy', '⟳ Saving…');
      try {
        const res = await fetch(JSONBIN_BASE + '/b/' + JSONBIN_BIN, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_KEY
          },
          body: JSON.stringify({ reviews: reviews, prices: prices })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        setSyncStatus('ok', '✓ Synced');
      } catch (e) {
        setSyncStatus('err', '✗ Sync error');
      }
    }

    // ── Price Tracker ─────────────────────────────────────────────────────────

    function renderPriceTracker(num) {
      var entry = entries[num] || {};

      // Build search-links section
      var searchSection = document.getElementById('priceSearchSection');
      searchSection.innerHTML = '';
      var names = [];
      if (entry.ed4) names.push({ label: '4th: ' + entry.ed4, q: entry.ed4 });
      if (entry.ed5) names.push({ label: '5th: ' + entry.ed5, q: entry.ed5 });

      names.forEach(function(item) {
        var row = document.createElement('div');
        row.className = 'price-search-row';
        var lbl = document.createElement('span');
        lbl.className   = 'price-search-label';
        lbl.textContent = item.label + ':';
        row.appendChild(lbl);
        RETAILERS.forEach(function(r) {
          var a = document.createElement('a');
          a.className    = 'btn-retailer';
          a.href         = r.url + encodeURIComponent(item.q);
          a.target       = '_blank';
          a.rel          = 'noopener noreferrer';
          a.textContent  = r.name;
          row.appendChild(a);
        });
        searchSection.appendChild(row);
      });

      // Show logged prices for this whisky, cheapest first
      var withIdx = prices.map(function(p, i) { return { p: p, i: i }; });
      var whiskyPrices = withIdx
        .filter(function(x) { return x.p.whiskyNum === num; })
        .sort(function(a, b) { return a.p.price - b.p.price; });

      var priceList = document.getElementById('priceList');
      priceList.innerHTML = '';

      if (whiskyPrices.length === 0) {
        priceList.innerHTML = '<p class="no-prices">No prices logged yet — be the first!</p>';
      } else {
        whiskyPrices.forEach(function(x, rank) {
          var p   = x.p;
          var idx = x.i;
          var div = document.createElement('div');
          div.className = 'price-item' + (rank === 0 ? ' cheapest' : '');

          var retailerHtml = (p.url && /^https?:\/\//.test(p.url))
            ? '<a href="' + escHtml(p.url) + '" target="_blank" rel="noopener noreferrer">' + escHtml(p.retailer) + '</a>'
            : escHtml(p.retailer);

          div.innerHTML =
            '<span class="price-amount">£' + p.price.toFixed(2) + '</span>' +
            '<span class="price-retailer">' + retailerHtml + '</span>' +
            (rank === 0 ? '<span class="price-cheapest-badge">cheapest</span>' : '') +
            '<span class="price-by">by ' + escHtml(p.loggedBy) + ' · ' + escHtml(p.date) + '</span>' +
            '<button class="btn-delete-review" onclick="deletePrice(' + idx + ')" title="Remove">✕</button>';

          priceList.appendChild(div);
        });
      }

      // Reset log form
      document.getElementById('priceLogForm').classList.remove('visible');
    }

    function togglePriceLogForm() {
      var form = document.getElementById('priceLogForm');
      form.classList.toggle('visible');
      if (form.classList.contains('visible')) {
        document.getElementById('plRetailer').focus();
      }
    }

    async function logPrice() {
      if (currentNum === null) return;
      var retailer = document.getElementById('plRetailer').value.trim();
      var priceVal = parseFloat(document.getElementById('plPrice').value);
      var url      = document.getElementById('plUrl').value.trim();
      var person   = document.getElementById('plPerson').value;

      if (!retailer) { flash(document.getElementById('plRetailer')); return; }
      if (isNaN(priceVal) || priceVal <= 0) { flash(document.getElementById('plPrice')); return; }
      if (url && !/^https?:\/\//.test(url)) { flash(document.getElementById('plUrl')); return; }

      var entry = entries[currentNum] || { ed4: '', ed5: '' };
      var now   = new Date();
      var date  = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

      prices.push({
        whiskyNum: currentNum,
        ed4:       entry.ed4,
        ed5:       entry.ed5,
        price:     parseFloat(priceVal.toFixed(2)),
        retailer:  retailer,
        url:       url,
        loggedBy:  person,
        date:      date,
        timestamp: now.getTime()
      });

      savePricesLocal();
      renderPriceTracker(currentNum);

      document.getElementById('plRetailer').value = '';
      document.getElementById('plPrice').value    = '';
      document.getElementById('plUrl').value      = '';

      await syncPush();
    }

    async function deletePrice(index) {
      if (!confirm('Remove this price entry?')) return;
      prices.splice(index, 1);
      savePricesLocal();
      renderPriceTracker(currentNum);
      await syncPush();
    }

    // ── Helpers ───────────────────────────────────────────────────────────────

    function flash(el) {
      el.style.borderColor = '#8b2500';
      setTimeout(function() { el.style.borderColor = ''; }, 1000);
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /** Returns the average of all non-zero values in ratingsObj, or 0 if none. */
    function calcAvg(ratingsObj) {
      var vals = PERSONS
        .map(function(p) { return ratingsObj[p.toLowerCase()] || 0; })
        .filter(function(v) { return v > 0; });
      if (vals.length === 0) return 0;
      return vals.reduce(function(a, b) { return a + b; }, 0) / vals.length;
    }

    /** Returns a 5-star HTML string for a numeric average (0–5). */
    function starsHtml(avg) {
      var round = Math.round(avg);
      return '★'.repeat(round) + '☆'.repeat(5 - round);
    }

    // ── Enter to add entry ────────────────────────────────────────────────────

    ['entryNum', 'entryEd4', 'entryEd5'].forEach(function(id) {
      document.getElementById(id).addEventListener('keydown', function(e) {
        if (e.key === 'Enter') addEntry();
      });
    });

    // ── Init ──────────────────────────────────────────────────────────────────

    renderEntries();
    renderReviews();
    syncPull();
  </script>

</body>
</html>
