<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0a00" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Whisky Club</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header>
    <h1>🥃 Whisky Club</h1>
    <p>Pick a number, taste the dram</p>
  </header>

  <nav class="main-nav">
    <button class="nav-btn active" id="nav-home" onclick="showPage('home')">🏠 Next Club</button>
    <button class="nav-btn" id="nav-whisky-list" onclick="showPage('whisky-list')">📋 Whisky List</button>
    <button class="nav-btn" id="nav-reviews" onclick="showPage('reviews')">✍️ Reviews <span id="reviewNavBadge" class="nav-badge" style="display:none"></span></button>
  </nav>

  <div class="container">

    <!-- ── HOME PAGE ─────────────────────────────────────────────────────── -->
    <div id="page-home" class="page">

      <div class="slots-row">

        <!-- Slot 1 -->
        <div class="slot-col">
          <button class="btn-generate" id="generateBtn1" onclick="selectNumber(1)">🎲 Generate Whisky 1</button>
          <div class="card slot-result-card" id="slotResult1">
            <button class="btn-slot-clear" onclick="clearSlot(1)" title="Clear">✕</button>
            <div class="slot-header">
              <span class="slot-label">Whisky 1</span>
              <div class="slot-number" id="slotNum1"></div>
            </div>
            <div class="slot-name" id="slotName1"></div>
            <div class="slot-rng" id="slotRng1"></div>
            <div class="price-tracker" id="priceTracker1">
              <div class="price-tracker-hdr"><h3>ℹ️ Whisky Info</h3></div>
              <div id="priceResult1"></div>
            </div>
            <button class="btn-secondary" onclick="openReviewForm(1)" style="width:100%;margin-top:auto">✍️ Add Tasting Notes</button>
          </div>
        </div>

        <!-- Slot 2 -->
        <div class="slot-col">
          <button class="btn-generate" id="generateBtn2" onclick="selectNumber(2)">🎲 Generate Whisky 2</button>
          <div class="card slot-result-card" id="slotResult2">
            <button class="btn-slot-clear" onclick="clearSlot(2)" title="Clear">✕</button>
            <div class="slot-header">
              <span class="slot-label">Whisky 2</span>
              <div class="slot-number" id="slotNum2"></div>
            </div>
            <div class="slot-name" id="slotName2"></div>
            <div class="slot-rng" id="slotRng2"></div>
            <div class="price-tracker" id="priceTracker2">
              <div class="price-tracker-hdr"><h3>ℹ️ Whisky Info</h3></div>
              <div id="priceResult2"></div>
            </div>
            <button class="btn-secondary" onclick="openReviewForm(2)" style="width:100%;margin-top:auto">✍️ Add Tasting Notes</button>
          </div>
        </div>

      </div>

      <!-- Roll Next Session button -->
      <div style="text-align:center;margin-top:0.5rem;">
        <button class="btn-roll-session" id="rollNextSessionBtn" onclick="rollNextSession()">🔒 Lock Session</button>
      </div>

      <!-- Shared review form -->
      <div class="card review-form" id="reviewForm">
        <h3>Rate &amp; Review <span id="reviewFormWhisky" class="review-form-whisky"></span></h3>
        <div class="person-ratings" id="personRatings"></div>
        <div class="avg-display" id="avgDisplay">Average: <span class="avg-val">—</span></div>
        <textarea id="reviewNotes" placeholder="Tasting notes… e.g. rich dried fruit, hint of peat, long finish" aria-label="Tasting notes" style="margin-top:0.6rem;"></textarea>
        <div class="review-actions">
          <button class="btn-add" onclick="saveReview()">Save Review</button>
          <button class="btn-clear" onclick="closeReviewForm()">Cancel</button>
        </div>
      </div>

    </div>

    <!-- ── WHISKY LIST PAGE ───────────────────────────────────────────────── -->
    <div id="page-whisky-list" class="page" style="display:none">
      <div class="card">
        <div class="header-row">
          <h2>📋 Whisky List</h2>
          <span class="count-badge" id="whiskyListBadge">0 tasted</span>
        </div>
        <div class="filter-bar">
          <input type="text" id="whiskyListSearch" placeholder="🔍 Filter by name or number…" oninput="renderWhiskyList()" aria-label="Filter whisky list" />
        </div>
        <div id="whiskyListContainer"></div>
      </div>
    </div>

    <!-- ── REVIEWS PAGE ──────────────────────────────────────────────────── -->
    <div id="page-reviews" class="page" style="display:none">
      <div class="card">
        <div class="header-row">
          <h2>✍️ Tasting Notes</h2>
          <div style="display:flex;gap:0.5rem;align-items:center;">
            <span class="count-badge" id="reviewCountBadge">0</span>
            <span class="sync-status off" id="syncStatus">⟳</span>
            <button class="btn-icon" onclick="syncPull()" title="Refresh from cloud">↻ Refresh</button>
            <button class="btn-clear" onclick="clearReviews()">Clear all</button>
          </div>
        </div>
        <div class="filter-bar">
          <input type="text" id="filterSearch" placeholder="🔍 Filter by #number or whisky name…" oninput="renderReviews()" aria-label="Filter reviews by number or whisky name" />
          <select id="sortOrder" onchange="renderReviews()" aria-label="Sort reviews by">
            <option value="date-desc">Newest first</option>
            <option value="date-asc">Oldest first</option>
            <option value="num-asc">Number ↑</option>
            <option value="num-desc">Number ↓</option>
            <option value="rating-desc">Rating ↓</option>
            <option value="rating-asc">Rating ↑</option>
          </select>
        </div>
        <div id="reviewsList"></div>
      </div>
    </div>

  </div>

  <footer>Whisky Club Selector &mdash; sip responsibly</footer>

  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ratings.js"></script>
  <script src="js/entries.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/price.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
